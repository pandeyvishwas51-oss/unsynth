[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unsynth"
version = "0.1.0"
description = "Local-first toolkit for detecting AI-generated text and disrupting classical detectors plus statistical LLM watermarks (SynthID-Text / tournament-sampling style)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "UnSynth Contributors" },
]
keywords = [
    "ai-detection",
    "watermark",
    "synthid",
    "claude-watermark",
    "tournament-sampling",
    "humanize",
    "stylometry",
    "c2pa",
    "privacy",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "httpx>=0.27",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
]
llm = [
    "ollama>=0.3",
]
transformers = [
    "transformers>=4.43",
    "torch>=2.3",
]
metadata = [
    "pillow>=10.3",
    "piexif>=1.1",
    "pypdf>=4.2",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]
all = [
    "unsynth[embeddings,llm,transformers,metadata,web]",
]

[project.urls]
Homepage = "https://github.com/pandeyvishwas51-oss/unsynth"
Documentation = "https://github.com/pandeyvishwas51-oss/unsynth#readme"
Repository = "https://github.com/pandeyvishwas51-oss/unsynth"
Issues = "https://github.com/pandeyvishwas51-oss/unsynth/issues"
Changelog = "https://github.com/pandeyvishwas51-oss/unsynth/blob/main/CHANGELOG.md"

[project.scripts]
unsynth = "unsynth.cli.main:app"

[project.entry-points."unsynth.detectors"]
classical = "unsynth.detectors.classical:ClassicalDetector"
stylometric = "unsynth.detectors.stylometric:StylometricDetector"
statistical = "unsynth.detectors.statistical:StatisticalWatermarkDetector"
anthropic = "unsynth.detectors.anthropic:AnthropicDetectionAdapter"

[project.entry-points."unsynth.rewriters"]
lexical = "unsynth.rewriters.lexical:LexicalRewriter"
structural = "unsynth.rewriters.structural:StructuralRewriter"
style = "unsynth.rewriters.style:StyleHumanizer"
paraphrase = "unsynth.rewriters.paraphrase:ParaphraseRewriter"
backtranslate = "unsynth.rewriters.backtranslate:BacktranslateRewriter"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
    "PTH",
    "PL",
]
ignore = [
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PLR0912",
    "PLR0915",
    "PLR0911",
    "PLC0415",
    "PLW0603",
    "B008",
    "UP042",
    "SIM905",
    "SIM108",
    "SIM105",
    "SIM102",
    "PLR1714",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "N802"]
"examples/**" = ["T201"]
"scripts/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_any_generics = true
packages = ["unsynth"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "transformers.*",
    "torch.*",
    "ollama.*",
    "piexif.*",
    "pypdf.*",
    "lxml.*",
    "bs4.*",
    "PIL.*",
    "fastapi",
    "fastapi.*",
    "uvicorn",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: optional integration tests that may need local models",
]

[tool.coverage.run]
source = ["src/unsynth"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 70

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]
