name: Feature request
description: A detector, rewriter, or backend UnSynth should grow
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a researcher or power user not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Prefer a new plugin over a core rewrite.
    validations:
      required: true
  - type: checkboxes
    id: honesty
    attributes:
      label: Honesty
      options:
        - label: This feature will not be marketed as cryptographic removal.
          required: true
